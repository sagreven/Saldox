<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Saldox">
  <title>Saldox</title>
  <!-- Sun disc -->
  <circle cx="32" cy="32" r="22" fill="#ffb627"/>
  <!-- Subtle inner glow ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffd166" stroke-width="2"/>
  <!-- The "X" that gives the brand its name — green, slightly off-center for energy -->
  <g stroke="#0b3d2e" stroke-width="6" stroke-linecap="round">
    <line x1="18" y1="18" x2="46" y2="46"/>
    <line x1="46" y1="18" x2="18" y2="46"/>
  </g>
  <!-- Sun rays — only the cardinal ones, kept light to balance the X -->
  <g stroke="#ffb627" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="2"  x2="32" y2="8"/>
    <line x1="32" y1="56" x2="32" y2="62"/>
    <line x1="2"  y1="32" x2="8"  y2="32"/>
    <line x1="56" y1="32" x2="62" y2="32"/>
  </g>
</svg>
